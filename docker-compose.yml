services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: equity
      POSTGRES_USER: equity
      POSTGRES_PASSWORD: equity
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - equity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity -d equity"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: equity-admin-backend:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: equity
      DB_USER: equity
      DB_PASSWORD: equity
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  equity-pgdata:
