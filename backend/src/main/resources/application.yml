spring:
  application:
    name: equity-admin
  jackson:
    generator:
      # Share counts must serialize as 800.0000-style decimals, never 8E+2.
      write-bigdecimal-as-plain: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:equity}
    username: ${DB_USER:equity}
    password: ${DB_PASSWORD:equity}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Force NUMERIC columns onto BigDecimal (no float/double anywhere).
        jdbc.lob.non_contextual_creation: true

server:
  port: ${SERVER_PORT:8080}
